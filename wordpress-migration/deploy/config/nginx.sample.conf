# nginx + PHP-FPM. Replace store.example, certificate paths and /srv/10bottlevalue.
server {
    listen 443 ssl http2;
    server_name store.example;
    ssl_certificate     /etc/letsencrypt/live/store.example/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/store.example/privkey.pem;
    root /srv/10bottlevalue/wordpress;
    index index.php;
    client_max_body_size 30m;   # support-chat attachments are limited to 25 MB

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header X-Frame-Options SAMEORIGIN always;
    server_tokens off;

    location ~ ^/(xmlrpc\.php|wp-config\.php|wp-config-sample\.php|readme\.html|license\.txt|wp-trackback\.php|wp-links-opml\.php|wp-signup\.php|wp-activate\.php)$ { return 404; }
    location ~ /\.(git|ht) { return 404; }
    location ~* \.(sql|env|bak|log)$ { return 404; }

    # Extra login in front of WordPress admin (htpasswd -B -c /etc/nginx/tbv-admin.htpasswd tbv-admin-gate).
    location = /wp-admin/admin-ajax.php { include fastcgi_params; fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name; fastcgi_pass unix:/run/php/php8.3-fpm.sock; }
    location ~ ^/wp-admin/(js|css|images)/ { try_files $uri =404; }
    location ~ ^/(wp-admin|wp-login\.php) {
        auth_basic "Restricted"; auth_basic_user_file /etc/nginx/tbv-admin.htpasswd;
        location ~ \.php$ { include fastcgi_params; fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name; fastcgi_pass unix:/run/php/php8.3-fpm.sock; }
        try_files $uri $uri/ /index.php?$args;
    }

    location ~* ^/wp-content/themes/.+/public/ { expires 1d; try_files $uri =404; }
    location / { try_files $uri $uri/ /index.php?$args; }
    location ~ \.php$ {
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param HTTPS on;
        fastcgi_pass unix:/run/php/php8.3-fpm.sock;
    }
}
server { listen 80; server_name store.example; return 301 https://$host$request_uri; }
