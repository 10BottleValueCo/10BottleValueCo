<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Your 10BottleValue sign-in code</title>
  </head>
  <body
    style="
      margin: 0;
      background: #f5f5f3;
      color: #181818;
      font-family: Arial, Helvetica, sans-serif;
    "
  >
    <table role="presentation" style="width: 100%; border-collapse: collapse">
      <tr>
        <td style="padding: 32px 16px">
          <table
            role="presentation"
            style="
              width: 100%;
              max-width: 520px;
              margin: 0 auto;
              border-collapse: collapse;
              background: #ffffff;
            "
          >
            <tr>
              <td style="padding: 32px">
                <p style="margin: 0 0 28px; font-size: 18px; font-weight: 700">
                  10BottleValue
                </p>
                <h1
                  style="margin: 0 0 16px; font-size: 26px; line-height: 1.25"
                >
                  Your sign-in code
                </h1>
                <p style="margin: 0 0 20px; font-size: 16px; line-height: 1.6">
                  Enter this six-digit code on the website to sign in. No
                  password needed.
                </p>
                <p
                  style="
                    margin: 0 0 24px;
                    padding: 18px;
                    background: #f5f5f3;
                    text-align: center;
                    font-family: monospace;
                    font-size: 34px;
                    font-weight: 700;
                    letter-spacing: 8px;
                  "
                >
                  {{ .Token }}
                </p>
                <p style="margin: 0 0 16px; font-size: 14px; line-height: 1.6">
                  You can also
                  <a
                    href="{{ .ConfirmationURL }}"
                    style="color: #181818; text-decoration: underline"
                    >sign in using this secure link</a
                  >.
                </p>
                <p
                  style="
                    margin: 0;
                    font-size: 13px;
                    line-height: 1.6;
                    color: #666666;
                  "
                >
                  If you did not request this email, you can ignore it. Do not
                  share your code or sign-in link.
                </p>
              </td>
            </tr>
          </table>
        </td>
      </tr>
    </table>
  </body>
</html>
