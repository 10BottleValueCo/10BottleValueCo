<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, viewport-fit=cover" />

    <!-- Primary meta — overridden dynamically by useSEO hook for every page -->
    <title>10BottleValueCo — Research Peptides At Wholesale Prices</title>
    <meta name="description" content="Buy research peptides in 10-vial kits. Up to 4× cheaper than most brands. BPC-157, TB-500, GLP-1-S, GLP-2-T, GLP-3-R and more. Ships worldwide. Research use only." />
    <meta name="robots" content="index, follow" />
    <meta name="theme-color" content="#000000" />
    <style>
      html, body, #root {
        min-height: 100%;
        margin: 0;
        background: #111;
      }
      #tbv-startup-fallback {
        box-sizing: border-box;
        display: flex;
        min-height: 100vh;
        align-items: center;
        justify-content: center;
        gap: 12px;
        padding: 24px;
        background: #111;
        color: #fff;
        font: 500 14px/1.4 system-ui, sans-serif;
      }
      .tbv-startup-spinner {
        width: 26px;
        height: 26px;
        flex: 0 0 auto;
        border: 2px solid rgba(255, 255, 255, .25);
        border-top-color: #fff;
        border-radius: 50%;
        animation: tbv-startup-spin .8s linear infinite;
      }
      @keyframes tbv-startup-spin {
        to { transform: rotate(360deg); }
      }
      @media (prefers-reduced-motion: reduce) {
        .tbv-startup-spinner { animation: none; }
      }
    </style>

    <!-- The product edge middleware replaces this with the product URL before
         the HTML is served. React keeps it in sync after the app loads. -->
    <link rel="canonical" href="https://10bottlevalue.co/" />

    <!-- Open Graph (defaults — useSEO overrides per page) -->
    <meta property="og:site_name" content="10BottleValue.co" />
    <meta property="og:title" content="10BottleValueCo — Research Peptides At Wholesale Prices" />
    <meta property="og:description" content="Buy research peptides in 10-vial kits. Up to 4× cheaper than most brands. BPC-157, TB-500, GLP-1-S, GLP-2-T, GLP-3-R and more. Ships worldwide. Research use only." />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://10bottlevalue.co/" />
    <meta property="og:image" content="https://10bottlevalue.co/logo.png" />

    <!-- Twitter Card (defaults — useSEO overrides per page) -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="10BottleValueCo — Research Peptides At Wholesale Prices" />
    <meta name="twitter:description" content="Buy research peptides in 10-vial kits. Up to 4× cheaper than most brands. Ships worldwide. Research use only." />
    <meta name="twitter:image" content="https://10bottlevalue.co/logo.png" />

    <!-- Favicon -->
    <link rel="icon" type="image/png" href="/favicon-logo.png" />

    <!-- Performance hints -->
    <link rel="dns-prefetch" href="https://js.stripe.com" />
    <!-- Buyer verification OTP script; the researcher entry gate is handled in-app. -->
    <script>
      const script = document.createElement("script");
      script.src = "https://getonmerit.com/attestly-otp.js";
      script.async = true;
      script.setAttribute("data-attestly-site-token", "site_0fa1ee6b819ebb8fa1c1e1740a51ae5ed8440baedaaf49eb");
      document.head.appendChild(script);
    </script>

    <!-- Organization + WebSite JSON-LD (static — visible to crawlers before JS) -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@graph": [
        {
          "@type": "Organization",
          "@id": "https://10bottlevalue.co/#organization",
          "name": "10BottleValue.co",
          "url": "https://10bottlevalue.co/",
          "logo": {
            "@type": "ImageObject",
            "url": "https://10bottlevalue.co/logo.png"
          },
          "contactPoint": {
            "@type": "ContactPoint",
            "email": "support@10bottlevalue.co",
            "contactType": "customer support"
          }
        },
        {
          "@type": "WebSite",
          "@id": "https://10bottlevalue.co/#website",
          "url": "https://10bottlevalue.co/",
          "name": "10BottleValue.co",
          "description": "Research peptides at wholesale prices — 10-vial kits, worldwide shipping.",
          "publisher": { "@id": "https://10bottlevalue.co/#organization" }
        }
      ]
    }
    </script>
    <!--
      SearchAction removed: the site's search is client-side state only.
      There is no URL template (/?search=...) that produces a real search results page.
      A fake SearchAction would misrepresent the site to Google.
    -->
  </head>
  <body>
    <div id="root">
      <main id="tbv-startup-fallback" role="status" aria-live="polite">
        <span class="tbv-startup-spinner" aria-hidden="true"></span>
        <span>Opening 10BottleValueCo…</span>
      </main>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
